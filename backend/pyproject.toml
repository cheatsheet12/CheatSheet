# Backend package: distribution metadata and application dependencies.
#
# Deliberately WITHOUT a [tool.ruff] / [tool.mypy] / [tool.pytest] section.
# Those configure every Python file in the repository — including the guards in
# .claude/hooks/ — so they live in the root pyproject.toml. Ruff and mypy walk up
# past this file to find them, which keeps one single set of rules for all Python.
#
# What belongs here: what makes `cheatsheet` an installable package, and what the
# application needs at runtime. What belongs at the root: how the code is checked.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cheatsheet"
version = "0.1.0"
description = "CheatSheet backend — modular monolith with hexagonal bounded contexts"
requires-python = ">=3.11"

# Runtime dependencies are added as each bounded context needs them, pinned, in
# the PR that introduces the use. The containers they correspond to are decided
# (see docs/architecture.md §2): FastAPI/Uvicorn, SQLAlchemy + asyncpg, Alembic,
# Celery + Redis, boto3 (Cloudflare R2), PyAfipWs (ADR-012).
#
# Still absent, and deliberately: boto3 (R2 is first used by the report generator,
# epic 9) and PyAfipWs (ARCA, epic 2). A dependency arrives with its first caller.
dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "celery[redis]==5.4.0",
    "redis==5.2.0",
    "structlog==24.4.0",
    # identity: password hashing (ADR-011) and the short-lived access token.
    "argon2-cffi==23.1.0",
    "pyjwt==2.9.0",
    # Outbound HTTP for the Google OAuth2 adapter. It is also a test dependency, but a
    # runtime caller now exists, so it belongs here too.
    "httpx==0.27.2",
    # identity: the invitation email (HU-E1-04 RN-02). SMTP rather than a provider SDK,
    # so the choice of transactional provider stays a deployment decision.
    "aiosmtplib==3.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cheatsheet"]
# PEP 561: ship the marker so consumers (starting with the test suite) see the types
# instead of silently degrading every import to Any.
artifacts = ["src/cheatsheet/py.typed"]
