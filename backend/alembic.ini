; Alembic configuration for the single PostgreSQL database (ADR-004).
;
; It lives in backend/ and not at the repository root because it configures one
; application, and the root is reserved for what governs the whole repository
; (CLAUDE.md §2.3). The guard in .claude/hooks/guard_edit.py blocks the other choice.
;
; There is no sqlalchemy.url here on purpose: the connection string is a credential
; and credentials never live in the repository. env.py reads DATABASE_URL_MIGRATIONS
; from the environment, which is the *owner* role — not the application role, which
; must remain subject to Row-Level Security.

[alembic]
; Both paths are resolved against this file (%(here)s) and not against the current
; working directory, which is what a bare `migrations` would mean. CI runs
; `alembic -c backend/alembic.ini upgrade head` from the repository root, and with a
; relative path that looks for <root>/migrations and dies with "Path doesn't exist" —
; before a single test has run. Anchoring here makes the command work from anywhere.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
version_path_separator = os
timezone = UTC

# One linear history. Branching migrations in a modular monolith with one shared
# schema produce merge points nobody can reason about during an incident.
revision_environment = false

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
