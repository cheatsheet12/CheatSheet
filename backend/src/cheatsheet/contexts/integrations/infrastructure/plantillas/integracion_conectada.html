<!-- Deliberately plain: inline styles only, no external stylesheet and no image.
     Mail clients strip <style> blocks and block remote content by default, so
     anything fancier degrades into something worse than this. -->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1c2430;">
  <h2 style="margin: 0 0 16px;">$sistema quedó conectado</h2>
  <p>Terminó la verificación de <strong>$sistema</strong> y ya está funcionando en tu cuenta.</p>
  <p>$detalle</p>
  <p style="margin: 24px 0;">
    <a href="$enlace"
       style="background: #2a6fdb; color: #ffffff; padding: 12px 20px;
              border-radius: 8px; text-decoration: none; display: inline-block;">
      Ver mis integraciones
    </a>
  </p>
  <p style="color: #6b7684; font-size: 13px;">— CheatSheet</p>
</div>
