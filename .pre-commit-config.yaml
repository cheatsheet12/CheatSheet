# Checks that run before every commit, on each team member's machine.
# They are the same ones CI runs: catching a problem here costs seconds,
# catching it in the PR costs a review cycle.
#
# Installation (once, after creating the virtual environment):
#     pre-commit install
#
# Skipping them with --no-verify is forbidden (CLAUDE.md §3.4) and blocked by a hook.

repos:
  # ------------------------------------------------------------------
  # Basic file hygiene
  # ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      # Prevents committing a private key by accident.
      - id: detect-private-key
      # Nobody commits directly onto the protected branches.
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]

  # ------------------------------------------------------------------
  # Python — the same rules as CI (see pyproject.toml)
  # ------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--strict]
        # The hook runs in its own isolated environment, so mypy only sees the libraries
        # listed here. Empty, it failed on any commit touching Python ("Cannot find
        # implementation or library stub for module named 'httpx'"), in files the commit
        # never changed, while `mypy .` in the project environment was clean.
        #
        # These are the typed imports of the backend and its tests, pinned to the same
        # versions as backend/pyproject.toml and requirements-dev.txt — keep them in sync.
        # Libraries silenced in [[tool.mypy.overrides]] (celery, boto3, openpyxl, …) are
        # left out on purpose: mypy does not read them.
        additional_dependencies:
          - fastapi==0.115.4
          - uvicorn[standard]==0.32.0
          - sqlalchemy[asyncio]==2.0.36
          - asyncpg==0.30.0
          - alembic==1.14.0
          - redis==5.2.0
          - structlog==24.4.0
          - argon2-cffi==23.1.0
          - pyjwt==2.9.0
          - httpx==0.27.2
          - cryptography==43.0.3
          - anthropic==1.4.0
          - defusedxml==0.7.1
          - types-defusedxml==0.7.0.20260504
          - pytest==8.4.2
          - pytest-asyncio==0.24.0

  # ------------------------------------------------------------------
  # Credentials — the same tool as the CI job
  # ------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
